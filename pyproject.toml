[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-project"
version = "0.1.0"
description = "Production RAG service: WebSocket chatbot + document ingestion on Weaviate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # file uploads (POST /ingest/upload)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "requests>=2.32",
    # rag
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langchain-weaviate>=0.0.5",
    "weaviate-client>=4.9,<5",
    # llm providers (all three are supported at runtime via LLM_SERVICE)
    "langchain-openai>=0.3,<0.4",
    "langchain-aws>=0.2,<0.3",
    "langchain-ollama>=0.3,<0.4",
    # document parsing (same loaders as the etech FileLoader)
    "pymupdf>=1.24",
    "unstructured[csv,docx,xlsx]>=0.15",
    # cross-encoder reranker (pulls torch CPU + transformers)
    "sentence-transformers>=3",
    "langsmith>=0.14.8",
    "deepeval>=4.3.0",
    "openrouter>=1.3.61",
    "litellm>=1.105.1",
    "langchain-litellm>=0.6.1",
    "redis>=8.1.0",
    "langgraph-checkpoint-postgres>=2.0.23,<3",
    "psycopg[binary,pool]>=3.3.6",
    "langgraph>=0.5.4,<0.6",
    "voyageai>=0.5.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*ReadOnly.*:UserWarning",
]
markers = ["integration: needs live Weaviate and an LLM key (run with -m integration)"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]
