services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      WEAVIATE_CONNECTION_TYPE: local
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      CACHE_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:latest
    restart: unless-stopped
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--maxmemory 1gb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  weaviate-data: