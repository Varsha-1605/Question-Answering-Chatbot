name: Enterprise RAG Build and Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: enterprise-rag
  UV_PYTHON: "3.13"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Install uv and enable caching
      - name: Setting Up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 2. Install Python
      - name: Setting Up Python
        run: uv python install 3.13

      # 3. Synchronize project dependencies from your lockfile
      - name: Install Dependencies
        run: uv sync --locked

      # 4. Run Tests
      - name: Run Tests
        env:
          OPENAI_API_KEY: test-key
        run: uv run pytest -v

      # 5. Build Docker Image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest .
        
      # 6. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Push Docker Image to Docker Hub
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

      # 8. Copy the production compose file to the EC2 instance
      - name: Copy Compose File to EC2 Instance
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: enterprise-rag

      # 9. Deploy to EC2 Instance

      # The ENV_FILE secret holds the whole .env (app settings plus POSTGRES_PASSWORD).
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/enterprise-rag
            cd ~/enterprise-rag

            cat > .env <<'ENV_FILE_END'
            ${{ secrets.ENV_FILE }}
            ENV_FILE_END
            chmod 600 .env

            export APP_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Always replace the app container so it runs the image just pulled
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps --wait app

            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
